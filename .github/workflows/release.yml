name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install
      - run: bun test
      - run: bun run typecheck
      - run: bun run compile:all
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/bin/**

  sign-macos:
    needs: compile
    runs-on: macos-latest
    if: ${{ secrets.APPLE_CERTIFICATE_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist/bin
      - name: codesign and notarize
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
        run: bash scripts/sign-macos.sh dist/bin
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-darwin-signed
          path: dist/bin/agentdeck-darwin-*

  sign-windows:
    needs: compile
    runs-on: windows-latest
    if: ${{ secrets.AUTHENTICODE_PFX != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist/bin
      - name: Authenticode
        env:
          AUTHENTICODE_PFX: ${{ secrets.AUTHENTICODE_PFX }}
          AUTHENTICODE_PFX_PASSWORD: ${{ secrets.AUTHENTICODE_PFX_PASSWORD }}
        shell: pwsh
        run: ./scripts/sign-windows.ps1 dist/bin
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-windows-signed
          path: dist/bin/agentdeck-windows-x64.exe

  draft-release:
    needs: [compile, sign-macos, sign-windows]
    if: ${{ always() && needs.compile.result == 'success' && (needs.sign-macos.result == 'success' || needs.sign-macos.result == 'skipped') && (needs.sign-windows.result == 'success' || needs.sign-windows.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist/bin
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: binaries-darwin-signed
          path: dist/bin
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: binaries-windows-signed
          path: dist/bin
      - name: checksums
        run: |
          cd dist/bin
          sha256sum agentdeck-darwin-arm64 agentdeck-darwin-x64 agentdeck-linux-x64 agentdeck-windows-x64.exe > SHA256SUMS
      - name: draft GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --title "${GITHUB_REF_NAME}" \
            --notes "Companion binaries. Unsigned unless Apple/Authenticode secrets were present. Check SHA256SUMS. The token is never printed; it is created in ~/.agentdeck/config.json." \
            dist/bin/agentdeck-darwin-arm64 \
            dist/bin/agentdeck-darwin-x64 \
            dist/bin/agentdeck-linux-x64 \
            dist/bin/agentdeck-windows-x64.exe \
            dist/bin/SHA256SUMS
